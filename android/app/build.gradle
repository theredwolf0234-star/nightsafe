plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.saferoute.app'
    compileSdk 35

    defaultConfig {
        applicationId "ai.saferoute.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/saferoute.keystore')
            storePassword 'saferoute123'
            keyAlias 'saferoute'
            keyPassword 'saferoute123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Zero mandatory external dependencies required for WebView runtime
}
